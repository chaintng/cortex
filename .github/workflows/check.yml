name: Cortex checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
          python-version: '3.12'
      - name: Locked unit checks
        run: uv sync --frozen && uv run pytest -q
      - name: Build Lambda image without publishing
        run: docker build --platform linux/amd64 -t cortex:check .
      - name: Verify packaged Lambda entry point
        run: docker run --rm --entrypoint python cortex:check -c 'import apps.lambda_handler'
  publish-development:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-dev')
    needs: check
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      release_ref: ${{ github.event.pull_request.head.sha }}
